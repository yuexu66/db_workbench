<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="工作台" />
    <title>个人工作台</title>
    <script type="module" crossorigin src="./assets/index-NMynoPOJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BsYffKc-.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').then(function (reg) {
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                // 有新 SW 接管且之前已有受控页面（即版本更新），自动刷新一次加载最新资源
                if (nw.state === 'activated' && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              });
            });
          }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
